services:
  - type: web
    name: luna-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEB_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
